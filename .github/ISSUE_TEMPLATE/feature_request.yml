name: Feature request
description: Suggest a local-first improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow without private logs or identifiers.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Include a synthetic example if useful. Keep the analyzer offline and read-only.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or relevant tool versions
